{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Lomi-Store</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>

/* Lomi-Store - Converted from Tailwind to Plain CSS */

:root {
  --background: 220 33% 97%;
  --foreground: 222 47% 11%;
  --card: 0 0% 100%;
  --card-foreground: 222 47% 11%;
  --popover: 0 0% 100%;
  --popover-foreground: 222 47% 11%;
  --primary: 156 49% 11%;
  --primary-foreground: 40 33% 97%;
  --secondary: 210 40% 96%;
  --secondary-foreground: 222 47% 11%;
  --muted: 210 40% 96%;
  --muted-foreground: 215 16% 47%;
  --accent: 32 95% 44%;
  --accent-foreground: 0 0% 100%;
  --destructive: 0 84% 60%;
  --destructive-foreground: 0 0% 100%;
  --success: 158 64% 21%;
  --success-foreground: 158 50% 92%;
  --border: 214 32% 91%;
  --input: 214 32% 91%;
  --sidebar-background: 0 0% 100%;
  --sidebar-foreground: 222 47% 11%;
  --sidebar-primary: 156 49% 11%;
  --sidebar-accent: 210 40% 96%;
  --sidebar-border: 214 32% 91%;
  --radius: 1rem;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body.product-modal-open {
  overflow: hidden;
  touch-action: none;
}

.min-h-screen { min-height: 100vh; }
.bg-background { background: hsl(var(--background)); }
.text-foreground { color: hsl(var(--foreground)); }

/* Header */
header.sticky {
  position: sticky;
  top: 0;
  z-index: 110;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  padding: 0 4px;
  border-bottom: 1px solid hsl(var(--border));
  background: hsl(var(--card) / 0.95);
  backdrop-filter: blur(12px);
}

@media (min-width: 768px) {
  header {
    height: 70px;
    padding: 0 10px;
  }
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.325rem;
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
}

.text-brand {
  background: linear-gradient(145deg, hsl(158 64% 21%), hsl(32 95% 35%));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.theme-btn,
.menu-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: hsl(var(--muted));
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.1s;
}

.theme-btn i {
  color: hsl(var(--foreground));
  font-size: 1rem;
}

.menu-btn {
  flex-direction: column;
  gap: 4px;
}

.menu-btn:active,
.theme-btn:active {
  transform: scale(0.95);
}

.menu-btn span {
  display: block;
  width: 20px;
  height: 2px;
  background: hsl(var(--foreground));
  border-radius: 1px;
}

/* Main */
main {
  padding-bottom: 40px;
}

/* Hero Carousel */
.carousel-section {
  margin: 12px;
  overflow: hidden;
  border-radius: 1.5rem;
  background: hsl(var(--card));
  box-shadow: 0 2px 8px hsl(222 47% 11% / 0.04);
}

@media (min-width: 640px) { .carousel-section { margin: 20px; } }
@media (min-width: 768px) { .carousel-section { margin: 40px; } }
@media (min-width: 1024px) {
  .carousel-section {
    margin-left: auto;
    margin-right: auto;
    max-width: 1400px;
  }
}

.carousel-track {
  display: flex;
  transition: transform 0.5s ease-out;
}

.carousel-slide {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  min-width: 100%;
  padding: 24px;
  background: transparent;
  text-align: center;
  cursor: pointer;
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

.carousel-slide::before,
.carousel-slide::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.carousel-slide::before {
  background: url("https://res.cloudinary.com/dcpqnmdas/image/upload/v1780684558/presents_ritccr.png") center/cover no-repeat;
  opacity: 0.04;
  z-index: 0;
}

.carousel-slide::after {
  background: hsl(var(--card) / 0);
  z-index: 1;
}

.carousel-slide > * {
  position: relative;
  z-index: 2;
}

.carousel-section {
  position: relative;
  overflow: hidden;
}

.carousel-pattern-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  transition: opacity 0.8s ease, filter 0.8s ease;
}

.carousel-pattern-layer svg {
  width: 100%;
  height: 100%;
  display: block;
}

.carousel-gradient-layer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  transition: background 0.8s ease, opacity 0.8s ease;
  opacity: 0.88;
  mix-blend-mode: multiply;
}

.carousel-track {
  position: relative;
  z-index: 2;
}

.carousel-dots {
  position: relative;
  z-index: 2;
}

.carousel-gradient-layer.fading,
.carousel-pattern-layer.fading {
  opacity: 0;
}

@media (min-width: 640px) {
  .carousel-slide {
    flex-direction: row;
    padding: 32px;
    text-align: left;
  }
}

@media (min-width: 768px) { .carousel-slide { padding: 48px; } }

.carousel-content { flex: 1; }

.carousel-title {
  margin-bottom: 8px;
  font-size: 1.25rem;
  font-weight: 800;
  line-height: 1.2;
}

@media (min-width: 640px) { .carousel-title { font-size: 1.5rem; } }
@media (min-width: 768px) { .carousel-title { font-size: 1.875rem; } }

.carousel-desc {
  font-size: 0.875rem;
  color: hsl(215deg 81.98% 24.68%);
}

@media (min-width: 640px) { .carousel-desc { font-size: 1rem; } }

.carousel-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 4px 12px;
  border-radius: 9999px;
  background: hsl(var(--accent));
  font-size: 0.75rem;
  font-weight: 700;
  color: hsl(var(--accent-foreground));
}

.carousel-badge.hot {
  background: linear-gradient(135deg, hsl(9 95% 58%), hsl(29 95% 48%));
  color: hsl(0 0% 100%);
}
.carousel-badge.trending {
  background: linear-gradient(135deg, hsl(156 49% 22%), hsl(171 74% 36%));
  color: hsl(0 0% 100%);
}
.carousel-badge.popular {
  background: linear-gradient(135deg, hsl(244 67% 58%), hsl(220 74% 52%));
  color: hsl(0 0% 100%);
}
.carousel-badge.featured {
  background: linear-gradient(135deg, hsl(48 96% 52%), hsl(31 95% 46%));
  color: hsl(24 60% 14%);
}
.carousel-badge.editors-pick {
  background: linear-gradient(135deg, hsl(334 82% 60%), hsl(287 70% 48%));
  color: hsl(0 0% 100%);
}
.carousel-badge.just-arrived {
  background: linear-gradient(135deg, hsl(193 84% 60%), hsl(210 88% 46%));
  color: hsl(0 0% 100%);
}
.carousel-badge.best-deal {
  background: linear-gradient(135deg, hsl(147 65% 48%), hsl(164 78% 34%));
  color: hsl(0 0% 100%);
}
.carousel-badge.flash-sale {
  background: linear-gradient(135deg, hsl(12 96% 60%), hsl(352 88% 56%));
  color: hsl(0 0% 100%);
}
.carousel-badge.top-rated {
  background: linear-gradient(135deg, hsl(262 72% 62%), hsl(231 72% 55%));
  color: hsl(0 0% 100%);
}
.carousel-badge.limited-stock {
  background: linear-gradient(135deg, hsl(24 92% 56%), hsl(12 90% 46%));
  color: hsl(0 0% 100%);
}
.carousel-badge.most-loved {
  background: linear-gradient(135deg, hsl(342 87% 60%), hsl(17 95% 58%));
  color: hsl(0 0% 100%);
}
.carousel-badge.staff-favorite {
  background: linear-gradient(135deg, hsl(214 80% 58%), hsl(189 78% 44%));
  color: hsl(0 0% 100%);
}
.carousel-badge.weekend-pick {
  background: linear-gradient(135deg, hsl(283 75% 60%), hsl(319 78% 55%));
  color: hsl(0 0% 100%);
}
.carousel-badge.new-drop {
  background: linear-gradient(135deg, hsl(173 78% 40%), hsl(196 86% 45%));
  color: hsl(0 0% 100%);
}
.carousel-badge.vip-choice {
  background: linear-gradient(135deg, hsl(43 92% 58%), hsl(332 72% 52%));
  color: hsl(0 0% 100%);
}
.carousel-badge.fresh-finds {
  background: linear-gradient(135deg, hsl(128 62% 56%), hsl(92 58% 46%));
  color: hsl(102 42% 13%);
}
.carousel-badge.mega-save {
  background: linear-gradient(135deg, hsl(357 88% 62%), hsl(41 98% 55%));
  color: hsl(0 0% 100%);
}
.carousel-badge.premium-pick {
  background: linear-gradient(135deg, hsl(222 30% 22%), hsl(258 58% 36%));
  color: hsl(45 100% 88%);
}
.carousel-badge.city-choice {
  background: linear-gradient(135deg, hsl(199 82% 58%), hsl(168 70% 38%));
  color: hsl(0 0% 100%);
}
.carousel-badge.crowd-favorite {
  background: linear-gradient(135deg, hsl(350 80% 60%), hsl(278 74% 54%));
  color: hsl(0 0% 100%);
}
.carousel-badge.fast-moving {
  background: linear-gradient(135deg, hsl(18 93% 55%), hsl(47 96% 52%));
  color: hsl(22 60% 15%);
}
.carousel-badge.showroom-pick {
  background: linear-gradient(135deg, hsl(158 54% 32%), hsl(140 48% 24%));
  color: hsl(120 25% 94%);
}

.carousel-meta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

.carousel-image-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.carousel-image {
  width: min(68vw, 220px);
  aspect-ratio: 1 / 1;
  border-radius: 1rem;
  object-fit: cover;
}

.carousel-discount-burst {
  position: absolute;
  top: -68px;
  right: -55px;
  display: grid;
  place-items: center;
  width: 86px;
  height: 86px;
  padding: 10px;
  background: radial-gradient(circle at 35% 35%, hsl(322.49deg 100% 50%) 58%, hsl(14 91% 48%) 100%);
  clip-path: polygon(50% 0%, 60% 12%, 74% 4%, 78% 20%, 92% 14%, 88% 30%, 100% 38%, 88% 50%, 100% 62%, 86% 70%, 92% 86%, 78% 80%, 74% 96%, 60% 88%, 50% 100%, 40% 88%, 26% 96%, 22% 80%, 8% 86%, 14% 70%, 0% 62%, 12% 50%, 0% 38%, 12% 30%, 8% 14%, 22% 20%, 26% 4%, 40% 12%);
  box-shadow: 0 18px 30px hsl(15 85% 38% / 0.32);
  color: hsl(0 0% 100%);
  text-align: center;
}

.carousel-discount-burst.free-burst {
  top: -62px;
  right: -37px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  clip-path: none;
  background: hsl(0deg 100% 50%);
  box-shadow: 0 18px 30px hsl(0 72% 42% / 0.34);
}

.carousel-discount-burst strong { display: block; font-size: 1.15rem; line-height: 1; }
.carousel-discount-burst span {
  display: block;
  margin-top: 3px;
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.carousel-discount-burst.desktop-only { display: none; }

@media (min-width: 640px) {
  .carousel-image { width: 240px; flex: 0 0 240px; }
}
@media (min-width: 768px) {
  .carousel-image { width: 320px; flex-basis: 320px; }
}
@media (min-width: 1024px) {
  .carousel-discount-burst.mobile-only { display: none; }
  .carousel-discount-burst.desktop-only {
    position: static;
    display: grid;
    margin-left: 31px;
  }
  .carousel-discount-burst.desktop-only.free-burst {
    width: 78px;
    height: 78px;
    margin-left: 31px;
  }
  .carousel-discount-burst.desktop-only strong { font-size: 1.3rem; }
  .carousel-discount-burst.desktop-only span { font-size: 0.68rem; }
}

.carousel-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  background: hsl(var(--card));
}

.carousel-dot {
  width: 8px;
  height: 8px;
  border: none;
  border-radius: 9999px;
  background: hsl(var(--border));
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.2s;
}

.carousel-dot.active { width: 28px; background: hsl(var(--accent)); }
.carousel-dot:not(.active):hover { background: hsl(var(--muted-foreground)); }

/* Search Section */
.search-section {
  margin: 12px;
  display: flex;
  flex-direction: row;
  gap: 12px;
  padding: 14px;
  border: 1px solid hsl(34 92% 56% / 0.28);
  border-radius: 1.35rem;
  background: linear-gradient(135deg, hsl(45 100% 96%) 0%, hsl(31 100% 92%) 52%, hsl(156 45% 94%) 100%);
}

@media (min-width: 640px) { .search-section { margin: 20px; } }
@media (min-width: 768px) { .search-section { margin: 40px; } }
@media (min-width: 1024px) {
  .search-section { margin-left: auto; margin-right: auto; max-width: 1400px; }
}

.search-wrapper { position: relative; flex: 2; }

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: hsl(var(--muted-foreground));
  pointer-events: none;
}

.input-field {
  width: 100%;
  padding: 7px 15px;
  border: 1px solid hsl(32 80% 62% / 0.45);
  border-radius: 9999px;
  background: hsl(0 0% 100% / 0.96);
  font-size: 0.75rem;
  font-weight: 500;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-field:focus {
  border-color: hsl(var(--accent));
  box-shadow: 0 0 0 3px hsl(var(--accent) / 0.3);
}

.input-field.pl-11 { padding-left: 44px; }

.category-select {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid hsl(32 80% 62% / 0.45);
  border-radius: 9999px;
  background: hsl(0 0% 100% / 0.96);
  font-size: 0.75rem;
  font-weight: 500;
  outline: none;
  cursor: pointer;
}

.category-select:focus { border-color: hsl(var(--accent)); }

/* Products Grid */
.products-section { margin: 12px; }
@media (min-width: 640px) { .products-section { margin: 20px; } }
@media (min-width: 768px) { .products-section { margin: 40px; } }
@media (min-width: 1024px) {
  .products-section { margin-left: auto; margin-right: auto; max-width: 1400px; }
}

.section-title {
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.25rem;
  font-weight: 800;
}

.text-accent { color: hsl(var(--accent)); }

.section-count {
  margin-left: 8px;
  font-size: 0.875rem;
  font-weight: 500;
  color: hsl(var(--muted-foreground));
}

.free-status-badge {
  margin-left: auto;
  padding: 5px 10px;
  border-radius: 9999px;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
}

.free-status-badge.on {
  background: hsl(var(--success) / 0.14);
  color: hsl(var(--success));
}

.free-status-badge.off {
  background: hsl(var(--destructive) / 0.14);
  color: hsl(var(--destructive));
}

.products-grid {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: calc((100% - 0px) / 3.1);
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  padding-bottom: 8px;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
}

.products-grid::-webkit-scrollbar { height: 6px; }
.products-grid::-webkit-scrollbar-thumb { border-radius: 9999px; background: hsl(var(--border)); }
.products-grid > .product-card { min-width: 0; scroll-snap-align: start; }

@media (min-width: 640px) {
  .products-grid {
    grid-auto-flow: row;
    grid-auto-columns: auto;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    overflow-x: visible;
    padding-bottom: 0;
    scroll-snap-type: none;
  }
}
@media (min-width: 768px) { .products-grid { gap: 20px; } }
@media (min-width: 1024px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1280px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }

/* Product Card */
.product-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 0.85rem;
  background: hsl(var(--card));
  box-shadow: 0 2px 8px hsl(222 47% 11% / 0.04);
  transition: box-shadow 0.2s, transform 0.2s;
}

.product-card.spotlight {
  box-shadow: 0 0 0 4px hsl(var(--accent) / 0.5), 0 0 0 10px hsl(var(--accent) / 0.16), 0 18px 36px hsl(222 47% 11% / 0.18);
  transform: translateY(-6px) scale(1.02);
  animation: spotlightPulse 0.9s ease-in-out 2;
}

@keyframes spotlightPulse {
  0% { box-shadow: 0 0 0 0 hsl(var(--accent) / 0.45), 0 0 0 0 hsl(var(--accent) / 0.18), 0 18px 36px hsl(222 47% 11% / 0.12); }
  50% { box-shadow: 0 0 0 5px hsl(var(--accent) / 0.55), 0 0 0 14px hsl(var(--accent) / 0.2), 0 22px 42px hsl(222 47% 11% / 0.18); }
  100% { box-shadow: 0 0 0 4px hsl(var(--accent) / 0.5), 0 0 0 10px hsl(var(--accent) / 0.16), 0 18px 36px hsl(222 47% 11% / 0.18); }
}

.product-card:hover { box-shadow: 0 10px 30px hsl(222 47% 11% / 0.08); }

.product-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  object-position: center;
  background: hsl(var(--muted));
  display: block;
}

.product-content {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  padding: 10px;
}

.product-category {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
  font-size: 0.56rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: hsl(var(--accent));
}

.product-category span:first-of-type { min-width: 0; }

.id_number-badge {
  flex: 0 0 auto;
  padding: 3px 8px;
  border-radius: 9999px;
  background: hsl(32deg 3.28% 88.59%);
  font-size: 0.52rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: hsl(0deg 0% 0%);
  white-space: nowrap;
}

.product-title { margin-bottom: 4px; font-size: 0.82rem; font-weight: 700; line-height: 1.25; }

.product-desc {
  margin-bottom: 12px;
  font-size: 0.62rem;
  color: hsl(var(--muted-foreground));
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.product-prices {
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) max-content;
  align-items: center;
  gap: 4px 6px;
  margin-top: auto;
  min-width: 0;
}

.old-price {
  grid-column: 1;
  min-width: 0;
  max-width: 100%;
  font-size: 0.62rem;
  color: hsl(var(--muted-foreground));
  text-decoration: line-through;
  white-space: nowrap;
  overflow: hidden;
}

.current-price {
  grid-column: 1;
  min-width: 0;
  max-width: 100%;
  font-size: 0.7rem;
  font-weight: 800;
  color: hsl(var(--primary));
  white-space: nowrap;
  overflow: hidden;
}

.discount-badge {
  grid-column: 2;
  grid-row: 1 / span 2;
  align-self: center;
  justify-self: end;
  min-width: max-content;
  max-width: 100%;
  padding: 2px 6px;
  border-radius: 9999px;
  background: hsl(var(--destructive));
  font-size: 0.52rem;
  font-weight: 700;
  color: hsl(var(--destructive-foreground));
  white-space: nowrap;
}

.discount-badge.free-badge {
  font-size: 0.7rem;
  color: hsl(var(--success-foreground));
}

@media (max-width: 420px) {
  .product-prices { grid-template-columns: minmax(0, 1fr); }
  .discount-badge { grid-column: 1; grid-row: auto; justify-self: end; margin-top: 2px; }
}

.product-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.availability-btn {
  padding: 5px 8px;
  border: none;
  border-radius: 9999px;
  font-size: 0.58rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;

// ============================================================
// LOMI-STORE — VANILLA JS

// ====== SUPABASE SETUP (run once in Supabase SQL editor) ======

//   id uuid PRIMARY KEY DEFAULT gen_random_uuid(),

// ====== STORAGE KEYS ======

// ====== LOCAL STORAGE HELPERS ======

// ====== REMOTE CONFIG ======
const API_BASE_URL    = "{{ api_base_url|escapejs }}";
const INITIAL_USER    = {{ user_json|default:"null"|safe }};
const CLD_CLOUD       = "{{ cloudinary_cloud_name|escapejs }}";
const CLD_PRESET      = "{{ cloudinary_upload_preset|escapejs }}";
const CLD_FOLDER      = "products";
const INTRO_VIDEO_URL = "https://res.cloudinary.com/dcpqnmdas/video/upload/v1777308048/intro_videos/InShot_20260427_182321485_sywbv2.mp4";
const DIRECTIONS_GUIDE_IMAGE = "https://res.cloudinary.com/dcpqnmdas/image/upload/v1777356846/guides/direction_gqnmru.jpg";

let productsSubscription = null;
let backendDisabled = false;
let backendDisableReason = "";
const REMOTE_REFRESH_INTERVAL_MS = 2000;

function hasRemoteBackend() {
  return Boolean(API_BASE_URL) && !backendDisabled;
}

function generateUUID() {
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    return crypto.randomUUID();
  }
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// ====== RETRY HELPER ======
async function withRetry(fn, retries = 2, delayMs = 800) {
  let lastError;
  for (let i = 0; i <= retries; i++) {
    try { return await fn(); }
    catch (err) {
      lastError = err;
      if (i < retries) await new Promise(r => setTimeout(r, delayMs * (i + 1)));
    }
  }
  throw lastError;
}

function disableRemoteBackend(reason = "Remote backend unavailable") {
  if (backendDisabled) return;
  backendDisabled = true;
  backendDisableReason = reason;
  if (productsSubscription && typeof productsSubscription.unsubscribe === "function") {
    productsSubscription.unsubscribe();
  }
  productsSubscription = null;
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  console.warn(reason);
}

function shouldDisableBackend(error) {
  const text = String(error?.message || error || "");
  return text.includes("Failed to fetch")
    || text.includes("ERR_NAME_NOT_RESOLVED")
    || text.includes("NetworkError")
    || text.includes("Network request failed");
}

function getCsrfToken() {
  const cookie = document.cookie
    .split(";")
    .map(item => item.trim())
    .find(item => item.startsWith("csrftoken="));
  if (cookie) return decodeURIComponent(cookie.split("=")[1]);
  const metaToken = document.querySelector('meta[name="csrf-token"]')?.content;
  return metaToken && metaToken !== "NOTPROVIDED" ? metaToken : "";
}

function getAuthToken() {
  return state.user?.token || loadSession()?.token || "";
}

function unwrapListPayload(payload) {
  if (Array.isArray(payload)) return payload;
  if (Array.isArray(payload?.results)) return payload.results;
  return [];
}

async function apiFetch(path, options = {}) {
  const headers = {
    Accept: "application/json",
    ...(options.body instanceof FormData ? {} : { "Content-Type": "application/json" }),
    ...(options.headers || {}),
  };
  const csrfToken = getCsrfToken();
  if (csrfToken) headers["X-CSRFToken"] = csrfToken;
  const token = getAuthToken();
  if (token) headers.Authorization = `Token ${token}`;

  const response = await fetch(`${API_BASE_URL}${path}`, {
    method: options.method || "GET",
    headers,
    body: options.body instanceof FormData || options.body == null
      ? options.body
      : JSON.stringify(options.body),
    credentials: "same-origin",
    cache: (options.method || "GET").toUpperCase() === "GET" ? "no-store" : "default",
  });
  if (response.status === 204) return null;
  const data = await response.json().catch(() => null);
  if (!response.ok) {
    const detail = data?.detail || data?.non_field_errors?.[0] || Object.values(data || {})[0];
    const error = new Error(typeof detail === "string" ? detail : `Request failed (${response.status})`);
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

// ====== MAPPERS ======
function mapSupabaseProduct(p) {
  const images = Array.isArray(p.image_urls) && p.image_urls.length
    ? p.image_urls
    : p.image
      ? [p.image]
      : [];
  const cloudinaryPublicIds = Array.isArray(p.cloudinary_public_ids) && p.cloudinary_public_ids.length
    ? p.cloudinary_public_ids
    : p.cloudinary_public_id
      ? [p.cloudinary_public_id]
      : [];
  return {
    id: p.id,
    idNumber: p.id_number,
    title: p.title,
    category: p.category,
    oldPrice: p.old_price,
    price: p.price,
    desc: p.description || "Premium item",
    image: p.image || images[0] || "",
    images,
    cloudinaryPublicId: p.cloudinary_public_id || "",
    cloudinaryPublicIds,
    available: Boolean(p.available),
    trending: Boolean(p.trending),
    carouselBadge: p.carousel_badge || "trending",
    phone: p.phone || "",
    whatsappLink: p.whatsapp_link || "",
    locationLink: p.location_link || "",
    agentId: p.agent || p.agent_id || "",
    isClaimed: Boolean(p.is_claimed),
    claimedByName: p.claimed_by_name || "",
    claimedByEmail: p.claimed_by_email || "",
    claimedAt: p.claimed_at || null,
    claimedServiceConfirmed: Boolean(p.claimed_service_confirmed),
    promoId: p.promo_id || "",
    trendingUntil: p.trending_until || null,
    createdAt: p.created_at || null,
  };
}

function mapSupabaseAgent(agent) {
  return {
    id: agent.id,
    fullName: agent.full_name,
    email: agent.email,
    password: agent.password || "",
    plan: agent.plan === "premium" ? "Premium Plan" : "Free Plan",
    subscriptionDays: Math.max(0, Number(agent.subscription_days) || 0),
    status: agent.status || "active",
    createdAt: agent.created_at || null,
  };
}

function mapProductToSupabase(p) {
  const images = Array.isArray(p.images) && p.images.length
    ? p.images
    : p.image
      ? [p.image]
      : [];
  const cloudinaryPublicIds = Array.isArray(p.cloudinaryPublicIds) && p.cloudinaryPublicIds.length
    ? p.cloudinaryPublicIds
    : p.cloudinaryPublicId
      ? [p.cloudinaryPublicId]
      : [];
  return {
    id: p.id,
    id_number: p.idNumber,
    title: p.title,
    category: p.category,
    description: p.desc,
    old_price: p.oldPrice,
    price: p.price,
    image: p.image,
    image_urls: images,
    cloudinary_public_id: p.cloudinaryPublicId || "",
    cloudinary_public_ids: cloudinaryPublicIds,
    available: p.available,
    trending: p.trending,
    carousel_badge: p.carouselBadge || "trending",
    phone: p.phone,
    whatsapp_link: p.whatsappLink || "",
    location_link: p.locationLink || "",
    agent: p.agentId || null,
    is_claimed: Boolean(p.isClaimed),
    claimed_by_name: p.claimedByName || "",
    claimed_by_email: p.claimedByEmail || "",
    claimed_at: p.claimedAt || null,
    claimed_service_confirmed: Boolean(p.claimedServiceConfirmed),
    promo_id: p.promoId || "",

  };
}

function mapAgentToSupabase(agent) {
  return {
    id: agent.id,
    full_name: agent.fullName,
    email: agent.email,
    password: agent.password || "",
    plan: agent.plan === "Premium Plan" ? "premium" : "free",

    status: agent.status || "active",

}

function mapSupabasePromotion(promo) {
  return {
    id: promo.id,
    agentId: promo.agent || promo.agent_id,
    fullName: promo.agent_name || promo.full_name || "",
    email: promo.agent_email || promo.email || "",
    postCount: Math.max(1, Number(promo.post_count) || 1),
    daysCount: Math.max(1, Number(promo.days_count) || 1),
    startDate: promo.start_date || new Date().toISOString().slice(0, 10),
    endDate: promo.end_date || new Date().toISOString().slice(0, 10),
    totalAmount: Number(promo.total_amount) || 0,
    status: promo.status || "active",
    createdAt: promo.created_at || null,
  };
}

function mapPromotionToSupabase(promo) {
  return {
    id: promo.id,
    agent: promo.agentId,
    post_count: Math.max(1, Number(promo.postCount) || 1),
    days_count: Math.max(1, Number(promo.daysCount) || 1),
    start_date: promo.startDate,
    end_date: promo.endDate,
    total_amount: Number(promo.totalAmount) || 0,
    status: promo.status || "active",
  };
}

// ====== CLOUDINARY UPLOAD ======
async function uploadToCloudinary(file) {
  if (!CLD_CLOUD || !CLD_PRESET) {
    throw new Error("Cloudinary upload is not configured");
  }
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLD_PRESET);
  formData.append("folder", CLD_FOLDER);

  const response = await withRetry(async () => {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`, {
      method: "POST",
      body: formData,
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error?.message || `Cloudinary upload failed (${res.status})`);
    }
    return res.json();
  }, 2, 1000);

  if (!response.secure_url) throw new Error("Cloudinary did not return a URL");
  return { url: response.secure_url, public_id: response.public_id };
}

// ====== SUPABASE OPERATIONS ======
async function fetchProductsFromSupabase() {
  if (!hasRemoteBackend()) return [];
  try {
    const data = await apiFetch("/products/");
    return unwrapListPayload(data).map(mapSupabaseProduct);
  } catch (error) {
    if (shouldDisableBackend(error)) disableRemoteBackend("Django API is unreachable. Using local data only.");
    throw error;
  }
}

async function fetchSettingsFromSupabase() {
  if (!hasRemoteBackend()) return null;
  try {
    const data = await apiFetch("/settings/");
    return {
      defaultLocationLink: data?.defaultLocationLink || "",
      productIdSequence: Math.max(1, Number(data?.productIdSequence) || 1),

}

async function fetchBagFromSupabase(user = state.user) {

    const data = await apiFetch("/bag/");

    if (shouldDisableBackend(error)) disableRemoteBackend("Django API is unreachable. Using local bag data only.");
    throw error;
  }

async function syncProductToSupabase(product) {
  if (!hasRemoteBackend()) return;
  return withRetry(async () => {
    const payload = mapProductToSupabase(product);
    try {
      await apiFetch(`/products/${product.id}/`, { method: "PATCH", body: payload });
    } catch (error) {
      if (error?.status !== 404 && !String(error?.message || "").includes("Not found")) throw error;
      await apiFetch("/products/", { method: "POST", body: payload });
    }
  });
}

async function deleteProductFromSupabase(productId) {
  if (!hasRemoteBackend()) return;

}

async function syncAgentToSupabase(agent) {

      await apiFetch(`/agents/${agent.id}/`, { method: "PATCH", body: payload });

    }

}

async function syncPromotionToSupabase(promo) {

    try {
      await apiFetch(`/promotions/${promo.id}/`, { method: "PATCH", body: payload });
    } catch (error) {
      if (!String(error?.message || "").includes("Not found")) throw error;
      await apiFetch("/promotions/", { method: "POST", body: payload });

async function deleteAgentFromSupabase(agentId) {
  if (!hasRemoteBackend()) return;
  return withRetry(async () => {
    await apiFetch(`/agents/${agentId}/`, { method: "DELETE" });
  });
}

async function syncSettingsToSupabase(settings) {
  if (!hasRemoteBackend()) return;
  return withRetry(async () => {
    await apiFetch("/settings/", {
      method: "PATCH",
      body: {
        defaultLocationLink: settings.defaultLocationLink || "",
        productIdSequence: Math.max(1, Number(settings.productIdSequence) || 1),
        promoPricePerDay: Math.max(1, Number(settings.promoPricePerDay) || 200),
      },
    });
  });
}

async function syncBagToSupabase(ids = state.bagProductIds, user = state.user) {
  if (!hasRemoteBackend()) return;
  const uniqueIds = Array.from(new Set(ids.filter(Boolean)));
  return withRetry(async () => {
    await apiFetch("/bag/clear/", { method: "POST", body: {} });
    for (const productId of uniqueIds) {
      await apiFetch("/bag/add/", { method: "POST", body: { product_id: productId } });
    }
  });
}

async function loadBag(user = state.user) {
  const localIds = loadBagFromLocal(user);
  if (!user?.email || !hasRemoteBackend()) return localIds;
  try {
    const remoteIds = await fetchBagFromSupabase(user);
    const mergedIds = Array.from(new Set([...remoteIds, ...localIds].filter(Boolean)));
    saveBagToLocal(mergedIds, user);
    if (mergedIds.length !== remoteIds.length || mergedIds.some((id, index) => remoteIds[index] !== id)) {
      await syncBagToSupabase(mergedIds, user);
    }
    return mergedIds;
  } catch (error) {
    console.warn("Bag fetch failed:", error);
    return localIds;
  }
}

async function saveBag(ids = state.bagProductIds, user = state.user) {
  if (!user?.email) return;
  const uniqueIds = Array.from(new Set(ids.filter(Boolean)));
  saveBagToLocal(uniqueIds, user);
  if (!hasRemoteBackend()) return;
  try {
    await syncBagToSupabase(uniqueIds, user);
  } catch (error) {

async function hydrateRemoteState() {
  if (!hasRemoteBackend()) return;
  showLoadingOverlay("Syncing store data…");
  try {
    const [promoRes, pRes, aRes, sRes] = await Promise.allSettled([
      fetchPromotionsFromSupabase(),
      fetchProductsFromSupabase(),
      fetchAgentsFromSupabase(),
      fetchSettingsFromSupabase(),
    ]);

    const hasNetworkFailure = [promoRes, pRes, aRes, sRes].some(result =>
      result.status === "rejected" && shouldDisableBackend(result.reason)
    );
    if (!hasNetworkFailure) {
      if (promoRes.status === "rejected") console.warn("Promotions fetch failed:", promoRes.reason);
      if (pRes.status === "rejected") console.warn("Products fetch failed:", pRes.reason);
      if (aRes.status === "rejected") console.warn("Agents fetch failed:", aRes.reason);
      if (sRes.status === "rejected") console.warn("Settings fetch failed:", sRes.reason);
    }

    const remotePromotions = promoRes.status === "fulfilled" ? promoRes.value : [];
    const remoteProducts   = pRes.status === "fulfilled" ? pRes.value : [];
    const remoteAgents     = aRes.status === "fulfilled" ? aRes.value : [];
    const remoteSettings   = sRes.status === "fulfilled" ? sRes.value : null;

    if (remoteSettings) state.settings = { ...state.settings, ...remoteSettings };

    const { products } = ensureProductIdNumbers(remoteProducts || []);
    state.products = products;
    state.agents   = remoteAgents || [];
    state.promotions = remotePromotions || [];
    const archivedPromos = archiveExpiredPromotions();

    saveProducts();
    saveAgents(state.agents);
    savePromotions(state.promotions);
    saveSettings();
    if (archivedPromos.length) Promise.resolve().then(() => syncArchivedPromotions(archivedPromos));
    renderMain();
  } catch (err) {
    if (!shouldDisableBackend(err)) console.error("Remote hydration error:", err);
  } finally {
    hideLoadingOverlay();
  }
}

async function replaceStateFromSupabase() {
  if (!hasRemoteBackend()) return;
  const [promoRes, pRes, aRes, sRes, bagRes] = await Promise.allSettled([
    fetchPromotionsFromSupabase(),
    fetchProductsFromSupabase(),
    fetchAgentsFromSupabase(),
    fetchSettingsFromSupabase(),
    state.user?.email ? fetchBagFromSupabase(state.user) : Promise.resolve(state.bagProductIds),
  ]);

  const remotePromotions = promoRes.status === "fulfilled" ? promoRes.value : state.promotions;
  const remoteProducts   = pRes.status === "fulfilled" ? pRes.value : state.products;
  const remoteAgents     = aRes.status === "fulfilled" ? aRes.value : state.agents;
  const remoteSettings   = sRes.status === "fulfilled" ? sRes.value : null;
  const remoteBagIds     = bagRes.status === "fulfilled" ? bagRes.value : state.bagProductIds;

  if (remoteSettings) state.settings = { ...state.settings, ...remoteSettings };
  const { products } = ensureProductIdNumbers(remoteProducts || []);
  state.products = products;
  state.agents   = remoteAgents || [];
  state.promotions = remotePromotions || [];
  state.bagProductIds = Array.from(new Set((remoteBagIds || []).filter(Boolean)));
  const archivedPromos = archiveExpiredPromotions();
  saveProducts();
  saveAgents(state.agents);
  savePromotions(state.promotions);
  saveSettings();
  saveBagToLocal(state.bagProductIds, state.user);
  if (archivedPromos.length) Promise.resolve().then(() => syncArchivedPromotions(archivedPromos));
}

function syncSelectedProductFromProducts() {
  if (!state.selectedProduct?.id) return false;

function fitPriceText(root = document) {

function formatPrice(amount) {
  const value = Number(amount);
  if (!Number.isFinite(value)) return "0Tzsh/=";
  if (value <= 0) return "Free";
  return `${Math.round(value).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 })}Tzsh/=`;
}

function isFreePrice(amount) {
  const v = Number(amount);
  return Number.isFinite(v) && v <= 0;
}

function formatPhoneLink(phone) {

function buildDirectionsUrl(sharedLink) {
  const raw = String(sharedLink || "").trim();
  if (!raw) return "";
  try {
    const url = new URL(raw);
    const params = url.searchParams;
    let dest = params.get("destination") || params.get("query") || params.get("q");
    if (!dest) {
      const atM = url.href.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      const mM  = url.href.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
      const pM  = url.pathname.match(/\/place\/([^/]+)/);
      if (atM) dest = `${atM[1]},${atM[2]}`;
      else if (mM) dest = `${mM[1]},${mM[2]}`;
      else if (pM) dest = decodeURIComponent(pM[1]).replace(/\+/g, " ");
    }
    if (!dest) return raw;
    return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
  } catch { return raw; }
}

function getAlphabetPrefix(index) {
  let v = index, r = "";
  do { r = String.fromCharCode(65 + (v % 26)) + r; v = Math.floor(v / 26) - 1; } while (v >= 0);
  return r;
}

function formatProductNumber(seq) {
  const block = Math.floor((seq - 1) / 999);
  const num   = ((seq - 1) % 999) + 1;
  if (block === 0) return String(num);
  return `${getAlphabetPrefix(block - 1)}${num}`;
}

function ensureProductIdNumbers(products) {
  const used = new Set();
  let seq = Math.max(1, Number(state.settings.productIdSequence) || 1);
  let changed = false;
  const normalized = products.map(p => {
    if (p.idNumber && !used.has(p.idNumber)) { used.add(p.idNumber); return p; }
    while (seq === 666 || used.has(formatProductNumber(seq))) seq++;
    const idNumber = formatProductNumber(seq);
    used.add(idNumber); seq++; changed = true;
    return { ...p, idNumber };
  });
  while (seq === 666 || used.has(formatProductNumber(seq))) seq++;
  state.settings.productIdSequence = seq;
  return { products: normalized, changed };
}

function getNextProductIdNumber() {
  const used = new Set(state.products.map(p => p.idNumber).filter(Boolean));
  let seq = Math.max(1, Number(state.settings.productIdSequence) || 1);
  while (seq === 666 || used.has(formatProductNumber(seq))) seq++;
  const idNumber = formatProductNumber(seq);
  state.settings.productIdSequence = seq + 1;
  saveSettings();
  return idNumber;
}

// Snapshot helpers to detect real data changes and avoid unnecessary DOM updates
function getProductsSnapshot() {
  try {
    return (state.products || []).map(p => [p.id, p.price, p.available, p.title, p.createdAt || p.claimedAt || p.trendingUntil || ""].join("|")).join(",");
  } catch (e) {
    return JSON.stringify(state.products || []);
  }
}

function getCarouselSnapshot() {
  try {
    const trending = getTrendingProducts().map(p => p.id).join(",");
    return `${trending}|${state.productFilter}|${state.category}`;
  } catch (e) { return ""; }
}

function renderRemoteRefresh() {
  if (shouldDeferAutoRender()) {
    state.pendingRemoteRender = true;
    return;
  }

  const prevProductsSnap = _lastRenderedProductsSnapshot;
  const prevCarouselSnap = _lastRenderedCarouselSnapshot;
  const currProductsSnap = getProductsSnapshot();
  const currCarouselSnap = getCarouselSnapshot();

  // If nothing changed, skip DOM updates
  if (currProductsSnap === prevProductsSnap && currCarouselSnap === prevCarouselSnap) {
    state.pendingRemoteRender = false;
    return;
  }

  // store new snapshots
  _lastRenderedProductsSnapshot = currProductsSnap;
  _lastRenderedCarouselSnapshot = currCarouselSnap;
  state.pendingRemoteRender = false;

  const prevScroll = { x: window.scrollX || 0, y: window.scrollY || 0 };
  renderHeader();
  renderSidebar();

  if (state.view === "home") {
    try {
      // update products section only if product list changed
      if (currProductsSnap !== prevProductsSnap) refreshProductsSection();

      // update carousel only if trending changed
      if (currCarouselSnap !== prevCarouselSnap) {
        const carouselEl = document.querySelector('.carousel-section');
        const tmp = document.createElement('div');
        tmp.innerHTML = renderCarousel() || '';
        if (carouselEl && tmp.firstElementChild) {
          carouselEl.innerHTML = tmp.firstElementChild.innerHTML;
          initCarousel();
        }
      }
    } catch (e) {
      renderMain();
    }
    renderFooter();
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(prevScroll.x, prevScroll.y)));
    return;
  }

  renderMain();
  renderFooter();
  requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(prevScroll.x, prevScroll.y)));
}

function flushPendingRemoteRenderIfSafe() {
  if (!state.pendingRemoteRender || shouldDeferAutoRender()) return;
  renderRemoteRefresh();
}

  const btn = $("#theme-toggle-btn");
  if (!btn) return;
  const icon = btn.querySelector("i");
  if (!icon) return;
  const isDark = document.body.classList.contains("dark");
  if (isDark) {
    document.body.classList.remove("dark");
    localStorage.setItem("lomi-theme", "light");
    if (icon.classList.contains("fa-sun")) icon.classList.replace("fa-sun", "fa-moon");
    btn.setAttribute("aria-label", "Switch to dark mode");
  } else {
    document.body.classList.add("dark");
    localStorage.setItem("lomi-theme", "dark");
    if (icon.classList.contains("fa-moon")) icon.classList.replace("fa-moon", "fa-sun");
    btn.setAttribute("aria-label", "Switch to light mode");
  }
}

function initThemeState() {
  try {
    const pref = localStorage.getItem("lomi-theme");
    const btn = document.getElementById("theme-toggle-btn");
    const icon = btn?.querySelector("i");
    if (pref === "dark") {
      document.body.classList.add("dark");
      if (icon) {
        icon.classList.remove("fa-moon");
        icon.classList.add("fa-sun");
        btn.setAttribute("aria-label", "Switch to light mode");
      }
    } else {
      document.body.classList.remove("dark");
      if (icon) {
        icon.classList.remove("fa-sun");
        icon.classList.add("fa-moon");
        btn.setAttribute("aria-label", "Switch to dark mode");
      }
    }
  } catch (e) {
    console.warn("initThemeState error", e);
  }
}

function renderProductModal() {
  const existing = $(".product-modal-overlay");
  if (existing) existing.remove();
  if (!state.selectedProduct) {
    document.body.classList.remove("product-modal-open");
    return;
  }

  const prod = state.selectedProduct;
  const isFree = isFreePrice(prod.price);
  const discount = prod.oldPrice && prod.oldPrice > prod.price
    ? Math.round(((prod.oldPrice - prod.price) / prod.oldPrice) * 100) : null;
  const phoneLink    = formatPhoneLink(prod.phone || "+255742000000");
  const whatsappLink = normalizeWhatsAppContactLink(prod.whatsappLink);
  const locationLink = buildDirectionsUrl(prod.locationLink || state.settings.defaultLocationLink);
  const isAdmin      = canManageProducts();
  const trendingAccess = getTrendingAccessState(prod);
  const canManageTrending = trendingAccess.allowed;
  const showTrendingControl = trendingAccess.showControl;
  const pickerOpen   = state.trendingPickerOpenFor === prod.id;
  const restrictedByAgent = isProductOwnedBySuspendedAgent(prod);
  const restrictedByClaim = prod.isClaimed && !canAccessClaimedProduct(prod);
  const hideDetails = restrictedByAgent || restrictedByClaim;
  const productImages = (prod.images && prod.images.length)
    ? prod.images
    : prod.image
      ? [prod.image]
      : [];
  const inBag = isProductInBag(prod.id);
  const productImagesAttr = JSON.stringify(productImages).replace(/'/g, "&#39;");

  const overlay = document.createElement("div");
  overlay.className = "product-modal-overlay";
  overlay.onclick = e => { if (e.target === overlay) closeProductModal(); };

  overlay.innerHTML = `
    <div class="product-modal">
      <button class="product-modal-close" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
      <div class="product-modal-body">
        ${productImages.length > 1 ? `
        <div class="product-modal-slider" data-images='${productImagesAttr}' data-index="0">
          <span class="multi-image-badge"><i class="fas fa-images"></i> ${productImages.length} photos</span>
          <button type="button" class="product-slider-nav prev" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>
          <div class="product-modal-viewport">
            <img src="${escHtml(productImages[0])}" alt="${escHtml(prod.title)}" class="product-modal-image" onerror="this.src='https://via.placeholder.com/900x900?text=Image'">
          </div>
          <button type="button" class="product-slider-nav next" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>
          <div class="slider-dots">
            ${productImages.map((_, index) => `
              <button type="button" class="slider-dot-btn" data-index="${index}" aria-label="View image ${index + 1}">
                <span class="slider-dot${index === 0 ? " active" : ""}"></span>
              </button>`).join("")}
          </div>
        </div>` : `
        <div class="product-modal-viewport">
          <img src="${escHtml(prod.image || productImages[0] || '')}" alt="${escHtml(prod.title)}" class="product-modal-image" onerror="this.src='https://via.placeholder.com/900x900?text=Image'">
        </div>`}
        <div class="product-modal-content">
          <div class="product-modal-topbar">
            <div class="product-modal-meta">
              <div class="product-modal-category"><i class="fas fa-tag"></i> ${escHtml(prod.category)}</div>
              ${prod.idNumber ? `<span class="id_number-badge">ID ${escHtml(String(prod.idNumber))}</span>` : ""}
            </div>
            ${state.user ? `
              <button class="product-modal-bag-btn ${inBag ? "in-bag" : ""}" type="button" onclick="promptAddToBag('${prod.id}')" aria-label="${inBag ? "Already in bag" : "Add to bag"}" title="${inBag ? "Already in bag" : "Add to bag"}">
                <i class="fas fa-bag-shopping"></i>
              </button>` : ""}
          </div>
          <h3 class="product-modal-title">${escHtml(prod.title)}</h3>
          ${hideDetails ? "" : `<p class="product-modal-desc">${escHtml(prod.desc)}</p>`}
          <div class="product-modal-prices">
            ${prod.oldPrice ? `<span class="old-price">${formatPrice(prod.oldPrice)}</span>` : ""}
            <span class="current-price">${formatPrice(prod.price)}</span>
            ${prod.isClaimed
              ? `<span class="discount-badge">CLAIMED</span>`
              : isFree ? `<span class="discount-badge free-badge">FREE</span>` : discount ? `<span class="discount-badge">-${discount}%</span>` : ""}
          </div>
          ${hideDetails ? "" : `
          <div class="product-modal-actions">
            <a class="product-icon-btn call-btn" href="${escHtml(phoneLink)}"><i class="fas fa-phone-alt"></i><span>Call</span></a>
            <button class="product-icon-btn whatsapp-btn whatsapp-circle-btn" type="button" onclick="openWhatsAppContact('${escHtml(whatsappLink || "")}')"
              aria-label="Contact on WhatsApp" title="Contact on WhatsApp">
              <i class="fab fa-whatsapp"></i>
            </button>
            ${locationLink
              ? `<button class="product-icon-btn location-btn" type="button" onclick="openDirectionsGuide('${escHtml(locationLink)}')"><i class="fas fa-location-dot"></i><span>Location</span></button>`
              : `<button class="product-icon-btn location-btn disabled" type="button" disabled><i class="fas fa-location-dot"></i><span>Location</span></button>`
            }
          </div>`}
          ${prod.isClaimed && hideDetails ? `<p class="product-desc" style="margin-top:12px;">This free product has already been claimed.</p>` : ""}
          ${showTrendingControl ? `
          <div class="product-admin-actions">
            <button class="product-icon-btn trending-toggle-btn ${prod.trending ? "active" : ""}" type="button" onclick="toggleTrendingPicker('${prod.id}')">
              <i class="fas ${prod.trending ? "fa-star" : "fa-plus"}"></i>
              <span>${prod.trending ? "Change Trending Badge" : state.user?.role === "agent" ? "Use Promo In Trending" : "Choose Trending Badge"}</span>
            </button>
            ${canManageTrending && prod.trending ? `
            <button class="product-icon-btn trending-toggle-btn" type="button" onclick="removeFromTrending('${prod.id}')">
              <i class="fas fa-xmark"></i><span>Remove Trending</span>
            </button>` : ""}
          </div>` : ""}
        </div>
      </div>
    </div>
    ${pickerOpen ? `
    <div class="trending-picker" onclick="closeTrendingPicker()">
      <div class="trending-picker-card" onclick="event.stopPropagation()">
        <h4 class="trending-picker-title">Choose Carousel Badge</h4>
        <p class="trending-picker-copy">Pick a badge for this trending product.</p>
        <select class="trending-picker-select" onchange="handleTrendingBadgeSelect('${prod.id}', this.value)">
          <option value="">Select carousel badge (optional)</option>
          ${Object.entries(carouselBadgeOptions).map(([key, opt]) =>
            `<option value="${key}" ${prod.carouselBadge === key ? "selected" : ""}>${opt.label}</option>`
          ).join("")}
        </select>
        <div class="trending-picker-actions">
          <button class="product-icon-btn trending-toggle-btn trending-picker-btn" type="button" onclick="closeTrendingPicker()">
            <i class="fas fa-forward"></i><span>Skip</span>
          </button>
        </div>
      </div>
    </div>` : ""}`;
  document.body.classList.add("product-modal-open");
  document.body.appendChild(overlay);
  initProductModalImageViewers();
  startProductModalImageSlider();
}

  let content = "";
  if (state.view === "home") {
    content += renderCarousel() + renderSearch() + renderProducts();
  } else if (state.view === "dashboard") {
    content += renderDashboard();
  } else if (state.view === "agents") {
    content += renderAgents();
  } else if (state.view === "promo") {
    content += renderPromo();
  } else if (state.view === "claimed-products") {
    content += renderClaimedProducts();
  } else if (state.view === "categories") {
    content += renderCategories();
  } else if (state.view === "bag") {
    content += renderBag();
  }

  main.innerHTML = content;
  requestAnimationFrame(() => fitPriceText(main));
  if (state.view === "home") {
    initCarousel();
    requestAnimationFrame(() => applyCarouselTheme(carouselIndex));
  }
}

function refreshProductsSection() {
  if (state.view !== "home") { renderMain(); return; }
  const section = $(".products-section");
  if (!section) { renderMain(); return; }

  const prevScroll = { x: window.scrollX || 0, y: window.scrollY || 0 };
  const tmp = document.createElement("div");
  tmp.innerHTML = renderProducts();
  const newSection = tmp.firstElementChild;
  if (!newSection) {
    renderMain();
    return;
  }

  section.innerHTML = newSection.innerHTML;
  section.className = newSection.className;
  section.id = newSection.id;

  requestAnimationFrame(() => {
    fitPriceText($(".products-section"));
    window.scrollTo(prevScroll.x, prevScroll.y);
  });
}

function renderCarousel() {
  const trending = getTrendingProducts();
  if (trending.length === 0) {
    carouselIndex = 0;
    return `
      <section class="carousel-section">
        <div class="carousel-slide">
          <div class="carousel-content">
            <h2 class="carousel-title">No trending products yet</h2>
            <p class="carousel-desc">Admin can mark products as trending from the product modal.</p>
            <span class="carousel-badge"><i class="fas fa-chart-line"></i> Waiting</span>
          </div>
        </div>
      </section>`;
  }
  if (carouselIndex >= trending.length) carouselIndex = 0;

  const slidesHtml = trending.map(prod => {
    const isFree   = isFreePrice(prod.price);
    const discount = prod.oldPrice && prod.oldPrice > prod.price
      ? Math.round(((prod.oldPrice - prod.price) / prod.oldPrice) * 100) : null;
    const badge = carouselBadgeOptions[prod.carouselBadge] || carouselBadgeOptions.trending;
    const restrictedByClaim = prod.isClaimed && !canAccessClaimedProduct(prod);
    const restrictedByAgent = isProductOwnedBySuspendedAgent(prod);
    const hideDetails = restrictedByClaim || restrictedByAgent;
    return `
    <div class="carousel-slide" onclick="focusProductCard('${prod.id}')">
      <div class="carousel-content">
        <h2 class="carousel-title">${escHtml(prod.title)}</h2>
        <p class="carousel-desc">${hideDetails ? "This product is no longer publicly available." : escHtml(prod.desc)}</p>
        <div class="carousel-meta">
          <span class="carousel-badge ${badge.className}"><i class="fas ${badge.icon}"></i> ${badge.label}</span>
          ${prod.isClaimed ? `<div class="carousel-discount-burst free-burst desktop-only"><div><strong>TAKEN</strong><span>Claimed</span></div></div>`
            : isFree ? `<div class="carousel-discount-burst free-burst desktop-only"><div><strong>FREE</strong><span>Product</span></div></div>`
            : discount ? `<div class="carousel-discount-burst desktop-only"><div><strong>-${discount}%</strong><span>Discount</span></div></div>` : ""}
        </div>
      </div>
      <div class="carousel-image-wrapper">
        ${prod.isClaimed ? `<div class="carousel-discount-burst free-burst mobile-only"><div><strong>TAKEN</strong><span>Claimed</span></div></div>`
          : isFree ? `<div class="carousel-discount-burst free-burst mobile-only"><div><strong>FREE</strong><span>Product</span></div></div>`
          : discount ? `<div class="carousel-discount-burst mobile-only"><div><strong>-${discount}%</strong><span>Discount</span></div></div>` : ""}
        <img src="${escHtml(prod.image)}" alt="${escHtml(prod.title)}" class="carousel-image" loading="lazy">
      </div>
    </div>`;
  }).join("");

  const dotsHtml = trending.map((_, i) =>
    `<button class="carousel-dot${i === carouselIndex ? " active" : ""}" onclick="goToSlide(${i})"></button>`
  ).join("");

  return `
    <section class="carousel-section">
      <div id="carousel-pattern-layer" class="carousel-pattern-layer">${buildCarouselPatternSVG(carouselIndex)}</div>
      <div id="carousel-gradient-layer" class="carousel-gradient-layer" style="background:${CAROUSEL_THEMES[carouselIndex % CAROUSEL_THEMES.length].gradient};"></div>
      <div class="carousel-track" style="transform:translateX(0)">${slidesHtml}</div>
      <div class="carousel-dots">${dotsHtml}</div>
    </section>`;
}

function renderProducts() {

    ? state.agents.find(a => a.id === state.agentProductFilterId) : null;
  const label = state.agentProductFilterId
    ? `${activeAgent?.fullName || "Agent"} Products`
    : state.productFilter === "trending" ? "Trending Products"

  const grid = filtered.length === 0
    ? `<div class="empty-state"><i class="fas fa-box-open"></i>No products found.</div>`
    : filtered.map(prod => {
        const canModify = canModifyProduct(prod);
        const isFree   = isFreePrice(prod.price);
        const discount = prod.oldPrice && prod.oldPrice > prod.price
          ? Math.round(((prod.oldPrice - prod.price) / prod.oldPrice) * 100) : null;
        const restrictedByAgent = isProductOwnedBySuspendedAgent(prod);
        const restrictedByClaim = prod.isClaimed && !canAccessClaimedProduct(prod);
        const hideDetails = restrictedByAgent || restrictedByClaim;
        return `
          <article class="product-card" id="product-card-${prod.id}" onclick="openProductModal('${prod.id}')">
            <img src="${escHtml(prod.image)}" alt="${escHtml(prod.title)}" class="product-img"
              onerror="this.src='https://via.placeholder.com/600x450?text=Image'" loading="lazy">
            <div class="product-content">
              <div class="product-category">
                <span><i class="fas fa-tag"></i> ${escHtml(prod.category)}</span>
                <span class="id_number-badge">${escHtml(String(prod.idNumber || ""))}</span>
              </div>
              <h3 class="product-title">${escHtml(prod.title)}</h3>
              ${hideDetails ? "" : `<p class="product-desc">${escHtml(prod.desc)}</p>`}
              ${hideDetails
                ? `<div class="product-prices"><span class="current-price">${prod.isClaimed ? "Claimed" : "Hidden"}</span>${prod.isClaimed ? `<span class="discount-badge">CLAIMED</span>` : ""}</div>`
                : `<div class="product-prices">
                    ${prod.oldPrice ? `<span class="old-price">${formatPrice(prod.oldPrice)}</span>` : ""}

                      ? `<span class="discount-badge">CLAIMED</span>`
                      : isFree ? `<span class="discount-badge free-badge">FREE</span>` : discount ? `<span class="discount-badge">-${discount}%</span>` : ""}

              ${hideDetails && !isAdmin ? "" : `<div class="product-actions">
                <button class="availability-btn ${prod.available ? "available" : "unavailable"}"
                  onclick="event.stopPropagation(); handleToggleAvailable('${prod.id}')"

                ${canModify ? `
                  <div class="admin-actions">
                    <button class="edit-btn" onclick="event.stopPropagation(); handleEdit('${prod.id}')"><i class="fas fa-edit"></i> Edit</button>
                    <button class="delete-btn" onclick="event.stopPropagation(); handleDelete('${prod.id}')"><i class="fas fa-trash-alt"></i></button>

              </div>`}
            </div>
          </article>`;
      }).join("");

  return `
    <section class="products-section">
      <h2 class="section-title">
        <i class="fas fa-fire text-accent"></i>
        <span>${label}</span>
        <span class="section-count">${filtered.length} item${filtered.length !== 1 ? "s" : ""}</span>

// ====== XSS HELPER ======
function escHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ====== ACTIONS ======
function getFilteredAgents() {
  const term = state.agentSearch.toLowerCase();
  return state.agents.filter(a => {
    const matchSearch = !term || a.fullName.toLowerCase().includes(term) || a.email.toLowerCase().includes(term);
    const matchFilter = state.agentFilter === "all" || getAgentEffectiveStatus(a) === state.agentFilter;
    return matchSearch && matchFilter;
  });
}

function getPromoPricePerDay() {
  return Math.max(1, Number(state.settings?.promoPricePerDay) || 200);
}

function toDateOnly(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return new Date().toISOString().slice(0, 10);
  return date.toISOString().slice(0, 10);
}

function normalizePromoDraft(draft = {}) {
  const startDate = draft.startDate || new Date().toISOString().slice(0, 10);
  const rawDays = Math.max(1, Number(draft.daysCount) || 1);
  const derivedEnd = draft.endDate || addDaysToDate(startDate, rawDays - 1);
  const daysCount = Math.max(1, getInclusiveDaysBetween(startDate, derivedEnd));
  const postCount = Math.max(1, Number(draft.postCount) || 1);
  return {
    ...draft,
    postCount,
    startDate,
    endDate: addDaysToDate(startDate, daysCount - 1),
    daysCount,
    totalAmount: postCount * daysCount * getPromoPricePerDay(),
  };
}

function addDaysToDate(dateStr, days) {
  const date = new Date(`${dateStr}T00:00:00`);
  if (Number.isNaN(date.getTime())) return new Date().toISOString().slice(0, 10);
  date.setDate(date.getDate() + Math.max(0, Number(days) || 0));
  return date.toISOString().slice(0, 10);
}

function getInclusiveDaysBetween(startDate, endDate) {
  const start = new Date(`${startDate}T00:00:00`);
  const end = new Date(`${endDate}T00:00:00`);
  if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 1;
  const diff = Math.round((end.getTime() - start.getTime()) / (24 * 60 * 60 * 1000));
  return Math.max(1, diff + 1);
}

function getPromoDraftPreview(draft = state.promoDraft || {}) {
  return normalizePromoDraft(draft);
}

function getPromoAgentMatches() {
  const term = state.promoSearch.toLowerCase().trim();
  return state.agents.filter(agent => {
    if (!term) return true;
    const haystack = `${agent.fullName} ${agent.email}`.toLowerCase();
    return haystack.includes(term);
  });
}

function getPromotionsBySection() {
  const sorted = [...state.promotions].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  return sorted.reduce((acc, promo) => {
    if (promo.status === "archived") acc.archived.push(promo);
    else acc.active.push(promo);
    return acc;
  }, { active: [], archived: [] });
}

function getPromoDashboardActiveAgentOptions() {
  const activeAgentIds = new Set(
    state.promotions
      .filter(promo => promo.status !== "archived")
      .map(promo => promo.agentId)
      .filter(Boolean)
  );
  return state.agents
    .filter(agent => activeAgentIds.has(agent.id))
    .sort((a, b) => a.fullName.localeCompare(b.fullName));
}

function getFilteredActivePromotions(promotions) {
  const term = state.promoDashboardSearch.toLowerCase().trim();
  return promotions.filter(promo => {
    const matchesSearch = !term || `${promo.fullName} ${promo.email}`.toLowerCase().includes(term);
    const matchesAgent = !state.promoDashboardAgentFilter || promo.agentId === state.promoDashboardAgentFilter;
    return matchesSearch && matchesAgent;
  });
}

function getPromotionStatus(promo) {
  if (!promo) return "expired";
  if (promo.status === "archived") return "archived";
  if (promo.status === "cancelled") return "cancelled";
  const today = toDateOnly(new Date());
  if (promo.endDate < today) return "expired";
  if (promo.startDate > today) return "upcoming";
  return "active";
}

function archiveExpiredPromotions() {
  const expiredIds = state.promotions
    .filter(promo => promo.status !== "archived" && promo.status !== "cancelled" && getPromotionStatus(promo) === "expired")
    .map(promo => promo.id);

  if (!expiredIds.length) return [];

  state.promotions = state.promotions.map(promo =>
    expiredIds.includes(promo.id)
      ? { ...promo, status: "archived" }
      : promo
  );
  savePromotions(state.promotions);
  return state.promotions.filter(promo => expiredIds.includes(promo.id));
}

async function syncArchivedPromotions(promos) {
  if (!promos.length || !hasRemoteBackend()) return;
  await Promise.allSettled(promos.map(syncPromotionToSupabase));
}

function getPromotionDaysLeft(promo) {
  if (!promo) return 0;
  const today = toDateOnly(new Date());
  if (promo.endDate < today) return 0;
  if (promo.startDate > today) return getInclusiveDaysBetween(promo.startDate, promo.endDate);
  return getInclusiveDaysBetween(today, promo.endDate);
}

function getPromotionDaysLabel(promo) {
  const daysLeft = getPromotionDaysLeft(promo);
  const status = getPromotionStatus(promo);
  if (status === "expired") return "0 days left";
  if (status === "upcoming") return `${daysLeft} day${daysLeft !== 1 ? "s" : ""} scheduled`;
  return `${daysLeft} day${daysLeft !== 1 ? "s" : ""} left`;
}

function getAgentPromoSummary(agentId) {
  const promos = state.promotions.filter(promo => promo.agentId === agentId);
  if (!promos.length) {
    return { text: "No promo credits", tone: "danger" };
  }
  const activePromo = promos.find(promo => getPromotionStatus(promo) === "active");
  if (activePromo) {
    const remaining = getPromotionSlotsRemaining(activePromo);
    const daysLeft = getPromotionDaysLeft(activePromo);
    const tone = daysLeft <= 3 || remaining <= 1 ? "warn" : "ok";
    return {
      text: `${remaining} credit${remaining !== 1 ? "s" : ""} • ${daysLeft} day${daysLeft !== 1 ? "s" : ""} left`,
      tone,
    };
  }
  const latestPromo = promos.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))[0];
  return {
    text: getPromotionStatus(latestPromo) === "upcoming" ? getPromotionDaysLabel(latestPromo) : "Promo expired",
    tone: "danger",
  };
}

function getPromotionAssignedProducts(promoId) {
  return state.products.filter(product =>
    product.promoId === promoId
    && product.trending
    && (!product.trendingUntil || new Date(product.trendingUntil).getTime() >= Date.now())
  );
}

function getPromotionSlotsRemaining(promo) {
  return Math.max(0, Math.max(1, Number(promo?.postCount) || 1) - getPromotionAssignedProducts(promo?.id).length);
}

function getActivePromotionsForAgent(agentId) {
  return state.promotions.filter(promo =>
    promo.agentId === agentId && getPromotionStatus(promo) === "active"
  );
}

function getEligiblePromotionForAgent(agentId, productId = "") {
  const activePromotions = getActivePromotionsForAgent(agentId);
  if (!activePromotions.length) return null;
  return activePromotions.find(promo => {
    const assigned = getPromotionAssignedProducts(promo.id);
    return assigned.some(product => product.id === productId) || assigned.length < Math.max(1, Number(promo.postCount) || 1);
  }) || null;
}

function getLatestPromotionForAgent(agentId) {
  const promotions = state.promotions
    .filter(promo => promo.agentId === agentId)
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  return promotions[0] || null;
}

function getTrendingAccessState(product) {
  if (isAdminUser()) return { allowed: true, showControl: true, reason: "admin" };
  if (state.user?.role !== "agent" || !state.user.agentId) {
    return { allowed: false, showControl: false, reason: "not-agent" };
  }
  if (!product || product.agentId !== state.user.agentId) {
    return { allowed: false, showControl: false, reason: "not-owner" };
  }

  const agent = getCurrentAgentRecord();
  if (getAgentEffectiveStatus(agent) === "suspended") {
    return {
      allowed: false,
      showControl: true,
      reason: "agent-suspended",
      title: "Agent Access Paused",
      message: "Your agent access is suspended right now. Contact your admin to reactivate your account.",
    };
  }

  if (product.trending && product.promoId) {
    return { allowed: true, showControl: true, reason: "already-trending" };
  }

  const eligiblePromo = getEligiblePromotionForAgent(state.user.agentId, product.id);
  if (eligiblePromo) return { allowed: true, showControl: true, reason: "promo-active", promo: eligiblePromo };

  const latestPromo = getLatestPromotionForAgent(state.user.agentId);
  if (!latestPromo) {
    return {
      allowed: false,
      showControl: true,
      reason: "no-credits",
      title: "No Promo Credits",
      message: "Contact your admin for more credits before adding this post to trending.",
    };
  }

  if (getPromotionStatus(latestPromo) !== "active") {
    return {
      allowed: false,
      showControl: true,
      reason: "promo-expired",
      title: "Promo Days Ended",
      message: "Your promo days have ended. Contact your admin for more credits to continue adding trending posts.",
    };
  }

  return {
    allowed: false,
    showControl: true,
    reason: "credits-finished",
    title: "Credits Finished",
    message: "You are out of promo credits. Contact your admin for more credits before adding another trending post.",
  };
}

function isPromotionStillValidForProduct(product) {
  if (!product?.trending) return false;
  if (!product.promoId) return true;
  const promo = state.promotions.find(item => item.id === product.promoId);
  if (!promo) return false;
  if (getPromotionStatus(promo) !== "active") return false;
  if (!product.trendingUntil) return false;
  return new Date(product.trendingUntil).getTime() >= Date.now();
}

function canManageTrendingForProduct(product) {
  return getTrendingAccessState(product).allowed;
}

function formatPromoAmount(amount) {
  return `${Number(amount || 0).toLocaleString("en-US")} TZS`;
}

function getAgentDaysLeft(agent) {
  const totalDays = Math.max(0, Number(agent?.subscriptionDays) || 0);
  if (!agent?.createdAt) return totalDays;
  const createdAt = new Date(agent.createdAt);
  if (Number.isNaN(createdAt.getTime())) return totalDays;
  const elapsedDays = Math.floor((Date.now() - createdAt.getTime()) / (24 * 60 * 60 * 1000));
  return Math.max(0, totalDays - Math.max(0, elapsedDays));
}

function getAgentEffectiveStatus(agent) {
  if (!agent) return "suspended";
  if (agent.status === "suspended") return "suspended";
  return getAgentDaysLeft(agent) <= 0 ? "suspended" : "active";
}

function getAgentSubscriptionMeta(agent) {
  const days = getAgentDaysLeft(agent);
  const isFreePlan = (agent.plan || "Free Plan") === "Free Plan";
  const text = isFreePlan
    ? days > 0 ? `${days} day${days !== 1 ? "s" : ""} left on free plan` : "Free plan expired"
    : days > 0 ? `${days} day${days !== 1 ? "s" : ""} left` : "Subscription expired";
  const tone = days <= 3 ? "danger" : days <= 5 ? "warn" : "ok";
  return { text, tone, days };
}

function getAgentForProduct(product) {
  if (!product?.agentId) return null;
  return state.agents.find(agent => agent.id === product.agentId) || null;
}

function isProductOwnedBySuspendedAgent(product) {
  const agent = getAgentForProduct(product);
  return Boolean(agent) && getAgentEffectiveStatus(agent) === "suspended";
}

function getClaimedProducts() {
  return state.products.filter(product => product.isClaimed && isFreePrice(product.price));
}

function getFilteredClaimedProducts() {
  const term = state.claimedSearch.toLowerCase();
  return getClaimedProducts().filter(product => {
    return !term
      || product.title.toLowerCase().includes(term)
      || String(product.idNumber || "").toLowerCase().includes(term)
      || String(product.claimedByName || "").toLowerCase().includes(term)
      || String(product.claimedByEmail || "").toLowerCase().includes(term);
  });
}

function formatAgentCreatedAt(createdAt) {
  if (!createdAt) return "Recently";
  const date = new Date(createdAt);
  if (Number.isNaN(date.getTime())) return "Recently";
  return date.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function getFilteredProducts() {
  const term = state.search.toLowerCase();
  return state.products.filter(p => {
    if (!canViewProductInListings(p)) return false;
    const matchSearch  = p.title.toLowerCase().includes(term) || String(p.idNumber || "").toLowerCase().includes(term);
    const matchCat     = state.category === "all" || (p.category || "Uncategorized") === state.category;
    const matchTrend   = state.productFilter !== "trending" || (p.trending && isPromotionStillValidForProduct(p));
    const matchFree    = state.productFilter !== "free" || isFreePrice(p.price);
    const matchAgent   = !state.agentProductFilterId || p.agentId === state.agentProductFilterId;
    return matchSearch && matchCat && matchTrend && matchFree && matchAgent;
  });
}

function syncPromoDraft(event) {
  const form = event?.currentTarget?.form || event?.target?.form;
  if (!form) return;
  const fd = new FormData(form);
  const previous = state.promoDraft || {};
  let startDate = fd.get("startDate")?.toString() || previous.startDate || new Date().toISOString().slice(0, 10);
  let endDate = fd.get("endDate")?.toString() || previous.endDate || startDate;
  let daysCount = Math.max(1, parseInt(fd.get("daysCount"), 10) || 1);

  if (event?.target?.name === "daysCount" || event?.target?.name === "startDate") {
    endDate = addDaysToDate(startDate, daysCount - 1);
  } else if (event?.target?.name === "endDate") {
    daysCount = getInclusiveDaysBetween(startDate, endDate);
  }

  state.promoDraft = normalizePromoDraft({
    ...previous,
    postCount: Math.max(1, parseInt(fd.get("postCount"), 10) || 1),
    daysCount,
    startDate,
    endDate,
  });
  renderPromoModal();
}

async function handleAuthSubmit() {
  const email    = $("#auth-email")?.value?.trim();
  const password = $("#auth-password")?.value ?? "";
  if (!email || !password) { toast("Please enter credentials", "error"); return; }

  if (state.authMode === "login") {
    showLoadingOverlay("Signing in…");
    try {
      const user = await apiFetch("/auth/login/", {
        method: "POST",
        body: { email, password },
      });
      state.user = {
        id: user.id,
        email: user.email,
        role: user.role || "customer",
        fullName: user.fullName || user.email?.split("@")[0] || "User",
        agentId: user.agentId || null,
        token: user.token || "",
      };
      saveSession(state.user);
      state.bagProductIds = await loadBag(state.user);
      toast(`Welcome, ${state.user.email}`, "success");
      state.view = "dashboard";
      closeAuth();
      render();
    } catch (err) {
      console.error("Login error:", err);
      toast(err.message || "Login failed — check your connection", "error");
    } finally {
      hideLoadingOverlay();
    }
  } else {
    const fullName        = $("#auth-name")?.value?.trim();
    const confirmPassword = $("#auth-confirm-password")?.value?.trim();
    if (!fullName) { toast("Please enter your full name", "error"); return; }
    if (password.length < 8) { toast("Password must be at least 8 characters", "error"); return; }
    if (password !== confirmPassword) { toast("Passwords do not match", "error"); return; }

    showLoadingOverlay("Creating account…");
    try {
      const resp = await apiFetch("/auth/signup/", {
        method: "POST",
        body: { name: fullName, email, password },
      });
      if (resp?.verification_required) {
        toast(resp.detail || "Check your email to verify your account", "success");
        closeAuth();
        render();
        return;
      }
      const user = resp;
      state.user = {
        id: user.id,
        email: user.email,
        role: user.role || "customer",
        fullName: user.fullName || fullName,
        agentId: user.agentId || null,
        token: user.token || "",
      };
      saveSession(state.user);
      state.bagProductIds = await loadBag(state.user);
      toast("Account created successfully", "success");
      closeAuth();
      render();
    } catch (err) {
      toast(err.message || "Signup failed", "error");
    } finally {
      hideLoadingOverlay();
    }
  }
}

async function handleAgentSubmit(event) {
  event.preventDefault();
  if (!isAdminUser()) { toast("Admin access required", "error"); return; }

  const fd   = new FormData(event.target);
  const fullName         = fd.get("fullName")?.toString().trim();
  const email            = fd.get("email")?.toString().trim().toLowerCase();
  const password         = fd.get("password")?.toString() || "";
  const confirmPassword  = fd.get("confirmPassword")?.toString() || "";
  const plan             = fd.get("plan")?.toString() || "Free Plan";
  const subscriptionDays = Math.max(0, parseInt(fd.get("subscriptionDays"), 10) || 0);

  if (!fullName || !email) { toast("Full name and email are required", "error"); return; }
  if (!state.agentEditing && !password) { toast("Password is required", "error"); return; }
  if ((password || confirmPassword) && password !== confirmPassword) { toast("Passwords do not match", "error"); return; }

  const duplicate = state.agents.find(a => a.email === email && a.id !== state.agentEditing?.id);
  if (duplicate) { toast("An agent with that email already exists", "error"); return; }

  const prev = state.agents.map(a => ({ ...a }));

  if (state.agentEditing) {
    const updated = state.agents.map(a => a.id !== state.agentEditing.id ? a
      : { ...a, fullName, email, plan, subscriptionDays, password: password || a.password });
    const upAgent = updated.find(a => a.id === state.agentEditing.id);
    try {
      if (upAgent) await syncAgentToSupabase(upAgent);
    } catch (err) { state.agents = prev; toast(err.message || "Agent sync failed", "error"); renderMain(); return; }
    state.agents = updated;
    saveAgents(state.agents);
    toast("Agent updated", "success");
  } else {
    const newAgent = {
      id: generateUUID(), fullName, email, password, plan, subscriptionDays,
      status: "active", createdAt: new Date().toISOString(),
    };
    try {
      await syncAgentToSupabase(newAgent);
    } catch (err) { state.agents = prev; toast(err.message || "Agent sync failed", "error"); renderMain(); return; }
    state.agents = [newAgent, ...state.agents];
    saveAgents(state.agents);
    toast("Agent registered", "success");
  }

  state.view = "agents";
  closeAgentModal();
  renderMain();
}

async function setTrendingProduct(id, badgeKey) {
  const product = state.products.find(item => item.id === id);
  const access = getTrendingAccessState(product);
  if (!product || !access.allowed) {
    if (access.showControl && access.title && access.message) openPromoCreditModal(access.title, access.message);
    else toast("This product is not eligible for trending right now", "error");
    return;
  }

  const selectedBadge = carouselBadgeOptions[badgeKey] ? badgeKey : "trending";
  const prev = state.products.map(p => ({ ...p }));
  const prevSel = state.selectedProduct ? { ...state.selectedProduct } : null;
  let updatedProd = null;
  const promo = !isAdminUser() && state.user?.agentId
    ? (access.promo || getEligiblePromotionForAgent(state.user.agentId, id))
    : null;

  state.products = state.products.map(p => {
    if (p.id !== id) return p;
    updatedProd = {
      ...p,
      trending: true,
      carouselBadge: selectedBadge,
      promoId: promo?.id || p.promoId || "",
      trendingUntil: promo ? `${promo.endDate}T23:59:59.999Z` : (isAdminUser() ? null : p.trendingUntil || null),
    };
    return updatedProd;
  });
  if (!updatedProd) return;
  saveProducts();

async function handleToggleAvailable(id) {

function initProductModalImageViewers() {
