name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mysite
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      LOMI_PUBLIC_SITE_URL: http://127.0.0.1:8000
      LOMI_API_BASE_URL: /api
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SUPERUSER_USERNAME: ci-admin
      DJANGO_SUPERUSER_EMAIL: ci-admin@example.com
      DJANGO_SUPERUSER_PASSWORD: ci-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Deployment checks
        env:
          DJANGO_DEBUG: "False"
        run: python manage.py check --deploy
