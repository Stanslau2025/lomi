services:
  - type: web
    name: my-lomi
    env: python
    rootDir: mysite
    buildCommand: "pip install -r requirements.txt && ./build.sh"
    startCommand: "gunicorn mysite.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://my-lomi.onrender.com"
      - key: LOMI_PUBLIC_SITE_URL
        value: "https://my-lomi.onrender.com"
      - key: LOMI_API_BASE_URL
        value: "/api"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: my-lomi-db
          property: connectionString

databases:
  - name: my-lomi-db
    plan: free
